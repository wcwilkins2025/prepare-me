(function () {
  'use strict';
  var UI = RD.ui, el = UI.el, $ = UI.$;
  UI.chrome();
  function nice(d) { return new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }); }
  RD.RELEASES.forEach(function (r) {
    $('main').appendChild(el('article', { class: 'card' }, [
      el('h2', { style: 'margin-top:0' }, r.title),
      el('p', { class: 'muted' }, el('time', { datetime: r.date }, nice(r.date))),
      el('ul', null, r.items.map(function (i) { return el('li', null, i); }))
    ]));
  });
})();
</script>
